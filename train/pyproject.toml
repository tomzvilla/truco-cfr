[project]
name = "truco-train"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.7", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.7,<2"]
export = ["safetensors>=0.4", "onnx>=1.16", "onnxruntime>=1.18"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
